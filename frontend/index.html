<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UniPods Memory</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="icon" type="image/png" href="/static/logo-unipod.png" />
</head>
<body>
  <header>
    <div class="brand">
      <img class="logo" src="/static/logo-unipod.png" alt="UniPod — UNDP" width="178" height="80" />
      <div>
        <h1>UniPods Memory</h1>
        <p data-i18n="tagline"></p>
      </div>
    </div>
    <div class="header-right">
      <div class="lang-switch" role="group" aria-label="Langue / Language">
        <button class="lang-btn" type="button" data-lang="fr" aria-pressed="false">FR</button>
        <button class="lang-btn" type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <div id="status" class="status">…</div>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="ask" data-i18n="tab_ask"></button>
    <button class="tab" data-tab="ingest" data-i18n="tab_ingest"></button>
    <button class="tab" data-tab="summary" data-i18n="tab_summary"></button>
  </nav>

  <main>
    <!-- Q/R -->
    <section id="tab-ask" class="panel active">
      <div id="chat" class="chat">
        <div class="msg bot">
          <span data-i18n="welcome"></span>
          <div id="examples" class="examples"></div>
        </div>
      </div>
      <form id="ask-form" class="ask">
        <input id="question" type="text" autocomplete="off" data-i18n-placeholder="placeholder" required />
        <button type="submit" data-i18n="ask_btn"></button>
      </form>
    </section>

    <!-- Ingestion -->
    <section id="tab-ingest" class="panel">
      <div class="card">
        <h2 data-i18n="ingest_title"></h2>
        <p class="hint" data-i18n-html="ingest_hint"></p>
        <form id="ingest-form">
          <input id="files" type="file" multiple accept=".txt,.md,.pdf" required />
          <div class="row">
            <label><span data-i18n="f_type"></span>
              <select id="doc_type">
                <option value="auto" data-i18n="t_auto"></option>
                <option value="chat" data-i18n="t_chat"></option>
                <option value="transcript" data-i18n="t_transcript"></option>
                <option value="document" data-i18n="t_document"></option>
              </select>
            </label>
            <label><span data-i18n="f_author"></span><input id="author" type="text" /></label>
            <label><span data-i18n="f_date"></span><input id="date" type="date" /></label>
          </div>
          <button type="submit" data-i18n="index_btn"></button>
        </form>
        <div id="ingest-result"></div>
      </div>
      <div class="card">
        <h2 data-i18n="docs_title"></h2>
        <table id="docs"><thead><tr><th></th><th></th><th></th><th></th><th></th><th></th></tr></thead><tbody></tbody></table>
      </div>
    </section>

    <!-- Résumé -->
    <section id="tab-summary" class="panel">
      <div class="card">
        <h2 data-i18n="summary_title"></h2>
        <p class="hint" data-i18n="summary_hint"></p>
        <div class="row">
          <select id="summary-source"></select>
          <button id="summary-btn" data-i18n="summary_btn"></button>
        </div>
        <div id="summary-result"></div>
      </div>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
