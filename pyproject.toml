[project]
name = "unipods-memory"
version = "1.0.0"
description = "Chatbot de mémoire collective (RAG) : chats, transcriptions de réunions et documents"
readme = "README.md"
requires-python = ">=3.10"
# Garder synchronisé avec requirements.txt (Vercel lit ce fichier, pip lit requirements.txt)
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "chromadb>=0.5.0",
    "pypdf>=4.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.vercel]
entrypoint = "backend.app.main:app"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
